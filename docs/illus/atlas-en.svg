<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Agent sessions become a context graph</title>
  <desc id="desc">Codex and Claude Code sessions from one project open as a graph and continue into a fresh CLI session.</desc>
  <rect width="520" height="300" rx="24" fill="#f8f7fb"/>
  <rect x="20" y="28" width="142" height="244" rx="16" fill="#fff" stroke="#ded9e8"/>
  <text x="38" y="55" fill="#888091" font-family="system-ui,sans-serif" font-size="11" font-weight="700">PROJECT SESSIONS</text>
  <rect x="33" y="73" width="116" height="48" rx="10" fill="#eeebfb" stroke="#bcb2f1"/>
  <text x="44" y="91" fill="#6b5ce7" font-family="monospace" font-size="9">CODEX</text>
  <text x="44" y="108" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Research question</text>
  <rect x="33" y="132" width="116" height="48" rx="10" fill="#fff" stroke="#ded9e8"/>
  <text x="44" y="150" fill="#777180" font-family="monospace" font-size="9">CLAUDE CODE</text>
  <text x="44" y="167" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Check evidence</text>
  <rect x="33" y="191" width="116" height="48" rx="10" fill="#fff" stroke="#ded9e8"/>
  <text x="44" y="209" fill="#777180" font-family="monospace" font-size="9">CODEX</text>
  <text x="44" y="226" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Draft conclusion</text>
  <path d="M162 98 C190 98 183 82 211 82" fill="none" stroke="#7567dc" stroke-width="2"/>
  <path d="M162 156 C190 156 183 150 211 150" fill="none" stroke="#7567dc" stroke-width="2"/>
  <path d="M162 215 C190 215 183 218 211 218" fill="none" stroke="#7567dc" stroke-width="2"/>
  <rect x="211" y="55" width="122" height="54" rx="12" fill="#fff" stroke="#c8c0f1"/>
  <text x="225" y="78" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Question</text>
  <text x="225" y="94" fill="#928b99" font-family="system-ui,sans-serif" font-size="9">context graph</text>
  <rect x="211" y="123" width="122" height="54" rx="12" fill="#fff" stroke="#eccb9b"/>
  <text x="225" y="146" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Explore branch</text>
  <text x="225" y="162" fill="#928b99" font-family="system-ui,sans-serif" font-size="9">kept visible</text>
  <rect x="211" y="191" width="122" height="54" rx="12" fill="#fff" stroke="#aad9c5"/>
  <text x="225" y="214" fill="#3d3845" font-family="system-ui,sans-serif" font-size="10" font-weight="700">Conclusion</text>
  <text x="225" y="230" fill="#928b99" font-family="system-ui,sans-serif" font-size="9">selected context</text>
  <path d="M272 109 L272 123" stroke="#7567dc" stroke-width="2"/>
  <path d="M272 177 L272 191" stroke="#7567dc" stroke-width="2"/>
  <path d="M333 218 C363 218 357 158 384 158" fill="none" stroke="#7567dc" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="384" y="116" width="116" height="84" rx="14" fill="#28252e"/>
  <circle cx="400" cy="133" r="3" fill="#f17979"/><circle cx="410" cy="133" r="3" fill="#e7bb60"/><circle cx="420" cy="133" r="3" fill="#69c58e"/>
  <text x="398" y="158" fill="#d8d3e1" font-family="monospace" font-size="9">fresh CLI</text>
  <text x="398" y="176" fill="#a99cf5" font-family="monospace" font-size="9">exact context →</text>
  <text x="398" y="190" fill="#8ed2b1" font-family="monospace" font-size="8">returns to graph</text>
</svg>
