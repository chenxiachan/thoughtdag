<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Answer versions and upstream staleness are separate</title>
  <desc id="desc">Regenerating in place adds an answer version to the same node. Editing upstream context marks the dependent answer stale without deleting its versions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#6d5dfc"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#4d4160" flood-opacity=".12"/></filter>
  </defs>

  <rect width="1200" height="520" rx="32" fill="#fbf8f3"/>
  <text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#211a2b">Versions record answers. Staleness records changed input.</text>
  <text x="64" y="91" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6472">The same node can keep several answers. An upstream change warns you without overwriting them.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="152" width="240" height="132" rx="20" fill="#fff" stroke="#c7bdfd" stroke-width="2"/>
    <rect x="86" y="174" width="94" height="28" rx="14" fill="#eeeaff"/>
    <text x="133" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#5e4be7">UPSTREAM</text>
    <text x="86" y="232" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#211a2b">Context edited</text>
    <text x="86" y="262" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6c6472">Current input is now v2</text>
  </g>

  <path d="M304 218H434" stroke="#6d5dfc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="434" y="126" width="702" height="270" rx="22" fill="#fff" stroke="#d9d2df" stroke-width="2"/>
    <text x="464" y="161" font-family="Inter, Arial, sans-serif" font-size="16" fill="#817788">216 tok</text>
    <rect x="546" y="140" width="154" height="30" rx="15" fill="#fff1d8"/>
    <text x="623" y="161" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#c06b00">↻ Upstream changed</text>
    <rect x="460" y="181" width="650" height="52" rx="14" fill="#f5f2f1"/>
    <text x="480" y="213" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#211a2b">Condense the work above into one takeaway</text>
    <rect x="460" y="247" width="650" height="76" rx="14" fill="#faf8f6"/>
    <text x="480" y="278" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="650" fill="#817788">CURRENT ANSWER</text>
    <text x="480" y="307" font-family="Inter, Arial, sans-serif" font-size="19" fill="#211a2b">The active answer remains visible and editable.</text>
    <text x="464" y="365" font-family="Inter, Arial, sans-serif" font-size="20" fill="#817788">↻</text>
    <text x="520" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#817788">‹</text>
    <rect x="542" y="338" width="80" height="38" rx="19" fill="#eeeaff"/>
    <text x="582" y="363" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5e4be7">v2 / 2</text>
    <text x="640" y="365" font-family="Inter, Arial, sans-serif" font-size="18" fill="#817788">›</text>
    <rect x="882" y="338" width="96" height="38" rx="19" fill="#f1eef5"/>
    <text x="930" y="363" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6c6472">v1 kept</text>
    <rect x="986" y="338" width="124" height="38" rx="19" fill="#e6e0ff"/>
    <text x="1048" y="363" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e4be7">v2 active</text>
  </g>

  <rect x="154" y="428" width="392" height="62" rx="18" fill="#eeeaff"/>
  <text x="182" y="454" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5e4be7">Regenerate in place</text>
  <text x="182" y="477" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6c6472">adds an answer version to this node</text>
  <rect x="654" y="428" width="392" height="62" rx="18" fill="#fff1d8"/>
  <text x="682" y="454" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#c06b00">Edit upstream context</text>
  <text x="682" y="477" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6c6472">marks the answer stale for review</text>
</svg>
