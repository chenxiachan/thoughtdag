# Desktop packages for the three platforms. Triggered by version tags (and
# by hand). Unsigned builds — signing lands with the Apple Developer setup.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
          prerelease: ${{ contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
