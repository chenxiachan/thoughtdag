<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">回答版本与上游陈旧是两件事</title>
  <desc id="desc">原地重新生成会在同一节点增加回答版本。编辑上游上下文会把下游答案标记为陈旧，但不会删除已有版本。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#6d5dfc"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#4d4160" flood-opacity=".12"/></filter>
  </defs>

  <rect width="1200" height="520" rx="32" fill="#fbf8f3"/>
  <text x="64" y="58" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#211a2b">版本记录答案，陈旧标记输入变化</text>
  <text x="64" y="91" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="18" fill="#6c6472">同一节点可以保留多个回答；上游变化只会提醒检查，不会覆盖已有版本。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="152" width="240" height="132" rx="20" fill="#fff" stroke="#c7bdfd" stroke-width="2"/>
    <rect x="86" y="174" width="88" height="28" rx="14" fill="#eeeaff"/>
    <text x="130" y="194" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5e4be7">上游节点</text>
    <text x="86" y="232" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="21" font-weight="700" fill="#211a2b">上下文已编辑</text>
    <text x="86" y="262" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#6c6472">当前输入已经是 v2</text>
  </g>

  <path d="M304 218H434" stroke="#6d5dfc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="434" y="126" width="702" height="270" rx="22" fill="#fff" stroke="#d9d2df" stroke-width="2"/>
    <text x="464" y="161" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#817788">216 tok</text>
    <rect x="546" y="140" width="126" height="30" rx="15" fill="#fff1d8"/>
    <text x="609" y="161" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c06b00">↻ 上游已变</text>
    <rect x="460" y="181" width="650" height="52" rx="14" fill="#f5f2f1"/>
    <text x="480" y="213" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#211a2b">把上面的工作浓缩成一句 takeaway</text>
    <rect x="460" y="247" width="650" height="76" rx="14" fill="#faf8f6"/>
    <text x="480" y="278" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="650" fill="#817788">当前回答</text>
    <text x="480" y="307" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="19" fill="#211a2b">当前版本仍然可见，也可以继续编辑。</text>
    <text x="464" y="365" font-family="Arial, sans-serif" font-size="20" fill="#817788">↻</text>
    <text x="520" y="365" font-family="Arial, sans-serif" font-size="18" fill="#817788">‹</text>
    <rect x="542" y="338" width="80" height="38" rx="19" fill="#eeeaff"/>
    <text x="582" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#5e4be7">v2 / 2</text>
    <text x="640" y="365" font-family="Arial, sans-serif" font-size="18" fill="#817788">›</text>
    <rect x="882" y="338" width="96" height="38" rx="19" fill="#f1eef5"/>
    <text x="930" y="363" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" fill="#6c6472">保留 v1</text>
    <rect x="986" y="338" width="124" height="38" rx="19" fill="#e6e0ff"/>
    <text x="1048" y="363" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e4be7">当前 v2</text>
  </g>

  <rect x="154" y="428" width="392" height="62" rx="18" fill="#eeeaff"/>
  <text x="182" y="454" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5e4be7">原地重新生成</text>
  <text x="182" y="477" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#6c6472">在这个节点中增加回答版本</text>
  <rect x="654" y="428" width="392" height="62" rx="18" fill="#fff1d8"/>
  <text x="682" y="454" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#c06b00">编辑上游或连线</text>
  <text x="682" y="477" font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#6c6472">把当前回答标记为陈旧，等待检查</text>
</svg>
