# Desktop packages for the three platforms. Triggered by version tags (and
# by hand). The release lifecycle is draft-first: a draft is created before
# the builds, every platform uploads into it, and a final job publishes it
# only when ALL of them succeeded. Installed apps checking for updates
# during the build window therefore keep seeing the previous complete
# release instead of a half-uploaded new one (the "could not check for
# updates" 404s of the per-job-publish era).
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "$TAG" --notes "Build in progress."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          # macOS signing + notarization: absent secrets = unsigned build
          # (electron-builder skips signing when CSC_LINK is empty)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
          if-no-files-found: error
      - name: Upload into draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/out/*.dmg desktop/out/*.zip desktop/out/*.exe \
                 desktop/out/*.AppImage desktop/out/latest*.yml desktop/out/*.blockmap)
          gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (all platforms complete)
        run: |
          if [[ "$TAG" == *beta* ]]; then
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$REPO" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
